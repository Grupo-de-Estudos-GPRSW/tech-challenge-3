<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Grupo de Estudos GPRSW">
  <defs>
    <linearGradient id="gprsw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="55%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#gprsw-bg)"/>
  <!-- medical cross, hollowed so the pulse line reads through it -->
  <path fill="#fff" fill-opacity=".95"
        d="M27 13h10a2 2 0 0 1 2 2v10h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H39v10a2 2 0 0 1-2 2H27a2 2 0 0 1-2-2V39H15a2 2 0 0 1-2-2V27a2 2 0 0 1 2-2h10V15a2 2 0 0 1 2-2Z"/>
  <!-- ECG pulse -->
  <path d="M6 32h9l4.5-9 6 18 5-9h6.5l4 7 4-7H58"
        fill="none" stroke="#0f172a" stroke-opacity=".78" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
