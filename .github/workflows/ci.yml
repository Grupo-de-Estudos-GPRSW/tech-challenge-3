name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline sem GPU
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Configurar diretório dos resultados
        shell: bash
        run: echo "EVAL_OUTPUT_DIR=$RUNNER_TEMP/eval-results" >> "$GITHUB_ENV"

      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Instalar dependências dos testes rápidos
        run: |
          python -m pip install -r requirements/ci.txt
          python -m pip check

      - name: Verificar sintaxe Python
        run: |
          python -m compileall -q src webapp eval finetuning run_ui.py run_eval.py

      - name: Executar testes do pipeline
        run: python -m eval.battery_pipeline

      - name: Registrar ambiente efetivo
        if: always()
        run: |
          mkdir -p "$EVAL_OUTPUT_DIR"
          python -VV > "$EVAL_OUTPUT_DIR/python.txt"
          python -m pip freeze > "$EVAL_OUTPUT_DIR/dependencias.txt"
          git rev-parse HEAD > "$EVAL_OUTPUT_DIR/commit.txt"

      - name: Publicar resultado da avaliação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-pipeline
          path: ${{ runner.temp }}/eval-results/
          if-no-files-found: warn
          retention-days: 14
